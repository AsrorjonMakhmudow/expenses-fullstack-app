name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # A real PostgreSQL for the API end-to-end tests.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: expenses
          POSTGRES_PASSWORD: expenses
          POSTGRES_DB: expenses_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U expenses"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://expenses:expenses@localhost:5432/expenses_test
      OWNER_EMAIL: ci@example.com

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
